name: CYBER RUN V2 Browser Smoke
on:
  pull_request:
    paths:
      - 'tools/browser-handcrafted-v2.cjs'
      - 'tools/browser-handcrafted-v2-fullrun.cjs'
      - 'tools/browser-google-sites-draft-v22.cjs'
      - 'cyber-run-v22-google-sites-draft.html'
      - 'handcrafted-level-v2.js'
      - 'game-handcrafted-v2.js'
      - 'handcrafted-playtest-v2.html'
      - '.github/workflows/handcrafted-browser-v2.yml'
  push:
    branches:
      - dev/handcrafted-circuit-01-20261023
    paths:
      - 'tools/browser-handcrafted-v2.cjs'
      - 'tools/browser-handcrafted-v2-fullrun.cjs'
      - 'tools/browser-google-sites-draft-v22.cjs'
      - 'cyber-run-v22-google-sites-draft.html'
      - 'handcrafted-level-v2.js'
      - 'game-handcrafted-v2.js'
      - 'handcrafted-playtest-v2.html'
      - '.github/workflows/handcrafted-browser-v2.yml'
  workflow_dispatch:
jobs:
  chromium-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Headless Chromium playtest smoke
        run: node --test tools/browser-handcrafted-v2.cjs
      - name: Full-length scripted run in real Chromium
        run: node --test tools/browser-handcrafted-v2-fullrun.cjs
      - name: Run direct-code standalone embed from start through clear and retry
        run: node --test tools/browser-google-sites-draft-v22.cjs
